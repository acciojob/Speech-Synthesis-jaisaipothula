<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text to Speech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #voice-select {
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Text to Speech</h1>
    <textarea id="text-input" rows="4" cols="50" placeholder="Enter text here..."></textarea><br>
    <select id="voice-select"></select><br>
    <label for="rate-slider">Rate:</label>
    <input type="range" id="rate-slider" min="0.5" max="2" value="1" step="0.1"><br>
    <label for="pitch-slider">Pitch:</label>
    <input type="range" id="pitch-slider" min="0" max="2" value="1" step="0.1"><br>
    <button id="speak-button">Speak</button>
    <button id="stop-button" disabled>Stop</button>

    <script src="script.js"></script>
</body>
</html>
