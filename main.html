<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Synthesis Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
    }
    .container {
      width: 50%;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    select, button, input[type="range"] {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 100%;
      display: block;
    }
    button {
      width: 48%;
      margin-right: 2%;
      cursor: pointer;
    }
    button:last-child {
      margin-right: 0;
    }
    .controls {
      display: flex;
      justify-content: space-between;
    }
    .controls div {
      flex: 1;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Text-to-Speech Application</h1>
    <textarea id="textInput" placeholder="Enter text here..."></textarea>
    
    <select id="voiceSelect"></select>
    
    <div class="controls">
      <div>
        <label for="rate">Rate:</label>
        <input type="range" id="rate" min="0.1" max="2" step="0.1" value="1">
      </div>
      <div>
        <label for="pitch">Pitch:</label>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
      </div>
    </div>
    
    <button id="speakButton">Speak</button>
    <button id="stopButton">Stop</button>
  </div>

  <script>
    // Speech synthesis and voice selection setup
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const rateSlider = document.getElementById('rate');
    const pitchSlider = document.getElementById('pitch');
    const speakButton = document.getElementById('speakButton');
    const stopButton = document.getElementById('stopButton');
    
    let synth = window.speechSynthesis;
    let voices = [];
    let currentSpeech = null;

    // Fetch available voices and populate the voice select dropdown
    function loadVoices() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = voice.name;
        voiceSelect.appendChild(option);
      });
    }

    // Initial load voices and refresh voices on change
    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadVoices;
    }
    loadVoices();

    // Speak the text when the 'Speak' button is clicked
    speakButton.addEventListener('click', () => {
      if (textInput.value.trim() === '') {
        alert('Please enter some text to speak!');
        return;
      }

      const utterance = new SpeechSynthesisUtterance(textInput.value);
      const selectedVoice = voices[voiceSelect.value];
      utterance.voice = selectedVoice;
      utterance.rate = parseFloat(rateSlider.value);
      utterance.pitch = parseFloat(pitchSlider.value);

      // Stop any previous speech before starting new speech
      if (currentSpeech) {
        synth.cancel(); // Stop any ongoing speech
      }
      
      currentSpeech = utterance;
      synth.speak(utterance);
    });

    // Stop the speech when the 'Stop' button is clicked
    stopButton.addEventListener('click', () => {
      if (currentSpeech) {
        synth.cancel(); // Stop ongoing speech
      }
    });

    // Dynamic update of speech synthesis settings
    rateSlider.addEventListener('input', () => {
      if (currentSpeech) {
        currentSpeech.rate = parseFloat(rateSlider.value);
      }
    });

    pitchSlider.addEventListener('input', () => {
      if (currentSpeech) {
        currentSpeech.pitch = parseFloat(pitchSlider.value);
      }
    });
  </script>
</body>
</html>
